[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
host_key_checking   = True
interpreter_python  = auto_silent
stdout_callback     = ansible.builtin.default
callbacks_enabled   = ansible.posix.profile_tasks
retry_files_enabled = False
# group_vars/webserver/vault.yml is loaded for every command against this
# host, ad-hoc included, so always ask rather than fail on decrypt.
ask_vault_pass      = True
nocows              = True

[callback_default]
result_format  = yaml
pretty_results = true

[privilege_escalation]
become          = True
become_method   = sudo
# sudo keeps its password on this host (DR-003 11.6): SSH is key-only, so the
# sudo password is a second factor between a stolen key and root. Ansible
# prompts for it every run instead of the host granting NOPASSWD.
become_ask_pass = True

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
