---
# R13: a host whose only way in is the network is unrecoverable when the
# network is what broke. The account must be able to log in at a console with
# a password (set in Imager, kept in the password manager). SSH stays key-only.
- name: Read console account password status
  ansible.builtin.command: "passwd -S {{ ansible_user }}"
  register: console_pw
  check_mode: false
  changed_when: false

- name: Refuse to continue without a console break-glass password
  ansible.builtin.assert:
    that: console_pw.stdout.split()[1] == 'P'
    fail_msg: >-
      {{ ansible_user }} has no usable password (status {{ console_pw.stdout.split()[1] }}).
      Set one at the console with `sudo passwd {{ ansible_user }}` and store it in
      the password manager before this host goes behind its firewall.

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ host_name }}"

- name: Pin hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1\t{{ host_name }}"
    owner: root
    group: root
    mode: "0644"

- name: Set timezone
  community.general.timezone:
    name: "{{ host_timezone }}"

# cloud-init applies Imager's first-boot customisation, then keeps rewriting
# /etc/hosts and hostname on every boot. Left enabled it contends with this
# playbook over the same files.
- name: Disable cloud-init
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# These hold the account password hash and WiFi PSK in cleartext on a FAT
# partition, where the reported -rwxr-xr-x root root is invented at mount
# time and enforces nothing.
- name: Remove cloud-init seed files containing cleartext credentials
  ansible.builtin.file:
    path: "/boot/firmware/{{ item }}"
    state: absent
  loop:
    - user-data
    - network-config

# Only move the address if the host is already on it. A mismatch here means
# the bootstrap went wrong; applying netplan would strand the host mid-run.
- name: Confirm the host is already on its DMZ address
  ansible.builtin.assert:
    that: dmz_address in (ansible_facts[dmz_interface]['ipv4']['address'] | default(''))
    fail_msg: >-
      {{ dmz_interface }} is not on {{ dmz_address }}. Fix the bootstrap address
      before letting this role pin it.

- name: Pin the DMZ address in netplan
  ansible.builtin.template:
    src: 90-dmz.yaml.j2
    dest: /etc/netplan/90-dmz.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply netplan

# cloud-init rendered the bootstrap address here. With cloud-init disabled it
# never changes again, but two files describing eth0 invites them to disagree.
- name: Remove cloud-init's network definition
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  notify: Apply netplan

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages + verification_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove unneeded packages
  ansible.builtin.apt:
    name: "{{ base_packages_absent }}"
    state: absent
    purge: true
    autoremove: true

# Single-homed on the DMZ. A dual-homed host bridges the two networks
# regardless of any firewall rule.
- name: Disable onboard radios at the firmware layer
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay={{ item }}"
    state: present
    owner: root
    group: root
    mode: "0755"
  loop:
    - disable-wifi
    - disable-bt
  notify: Reboot required

- name: Remove stored WiFi connection profiles
  ansible.builtin.find:
    paths: /etc/netplan
    patterns: "*NM*.yaml"
    contains: "wifis:"
  register: wifi_profiles

- name: Report stored WiFi profiles for manual removal
  ansible.builtin.debug:
    msg: >-
      WiFi credentials still present in {{ wifi_profiles.files | map(attribute='path') | list }}.
      Remove with: nmcli connection delete <name>
  when: wifi_profiles.files | length > 0

- name: Create swapfile
  ansible.builtin.command:
    cmd: "fallocate -l {{ swapfile_size_mb }}M {{ swapfile_path }}"
    creates: "{{ swapfile_path }}"

- name: Secure swapfile
  ansible.builtin.file:
    path: "{{ swapfile_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Check whether swapfile is formatted
  ansible.builtin.command: "file -b {{ swapfile_path }}"
  register: swapfile_type
  check_mode: false
  changed_when: false

- name: Format swapfile
  ansible.builtin.command: "mkswap {{ swapfile_path }}"
  when: "'swap file' not in swapfile_type.stdout"

# Priority below zram's 100 so compressed RAM fills first and the card is
# only touched under real pressure.
- name: Register swapfile in fstab
  ansible.posix.mount:
    path: none
    src: "{{ swapfile_path }}"
    fstype: swap
    opts: "sw,pri={{ swapfile_priority }}"
    state: present

- name: Activate swap
  ansible.builtin.command: swapon -a
  changed_when: false

# ── microSD wear (DR-003 7) ───────────────────────────────────────────────
- name: Mount root with noatime and batched journal commits
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\S+\s+/\s+ext4\s+)\S+'
    replace: '\g<1>{{ root_mount_opts }}'
  notify: Remount root

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep the systemd journal in RAM
  ansible.builtin.template:
    src: 10-volatile.conf.j2
    dest: /etc/systemd/journald.conf.d/10-volatile.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

# A separate 52- file rather than editing the shipped 50- config: package
# upgrades can replace 50unattended-upgrades, and a higher number wins.
- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Enable periodic apt runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
