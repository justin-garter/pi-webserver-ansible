---
- name: Deploy thermal logging script
  ansible.builtin.template:
    src: pi-thermal.sh.j2
    dest: /usr/local/bin/pi-thermal.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy thermal units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pi-thermal.service
    - pi-thermal.timer
  notify: Reload systemd

- name: Enable thermal timer
  ansible.builtin.systemd:
    name: pi-thermal.timer
    enabled: true
    state: started
    daemon_reload: true
