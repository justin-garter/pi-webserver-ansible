---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# The admin sources must be non-empty, or the ruleset admits no SSH at all and
# the only way back in is the console.
- name: Refuse to deploy a ruleset that admits no SSH source
  ansible.builtin.assert:
    that: ssh_admin_sources | length > 0
    fail_msg: ssh_admin_sources is empty. Applying this ruleset would lock out SSH.

# This host does not route (DR-003 4.2). Pinned, not derived.
- name: Disable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    sysctl_file: /etc/sysctl.d/99-no-forward.conf
    sysctl_set: true
    reload: true
    state: present

- name: Deploy ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Read effective forwarding state
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: ip_forward_state
  check_mode: false
  changed_when: false

- name: Assert forwarding is off
  ansible.builtin.assert:
    that: ip_forward_state.stdout | trim == '0'
    fail_msg: net.ipv4.ip_forward is {{ ip_forward_state.stdout | trim }}; this host must not route.
