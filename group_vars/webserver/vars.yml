---
# ── Host identity ────────────────────────────────────────────────────────────
host_name: JG-RPi-WebServer
host_timezone: America/New_York

# ── Network ──────────────────────────────────────────────────────────────────
# VLAN 40 behind OPNsense (DR-002, DR-003). The DMZ has no DHCP by design, so
# the address is pinned in netplan by roles/base rather than leased.
dmz_interface: eth0
dmz_address: 10.10.40.10
dmz_prefix: 24
dmz_gateway: 10.10.40.1
dmz_dns:
  - 10.10.40.1

# ── SSH ──────────────────────────────────────────────────────────────────────
ssh_port: 2222

# ── Firewall ─────────────────────────────────────────────────────────────────
# SSH is admitted by source address, not interface (DR-003 4.2, amended
# 2026-09-29): VLAN 10 (Mgmt) plus the admin desktop, which sits on VLAN 20
# (Main) and is pinned to 10.10.20.10 by an OPNsense static mapping. OPNsense
# enforces the same scope upstream; this is the host-level half. If both paths
# fail, recovery is the console login in DR-003 section 6.
ssh_admin_sources:
  - 10.10.10.0/24
  - 10.10.20.10/32
nft_public_tcp_ports: [80, 443]
# HTTP/3 (udp 443) intentionally absent: not forwarded at the router, and
# Cloudflare reaches origin over TCP. Caddy is told not to advertise it.

# ── Caddy ────────────────────────────────────────────────────────────────────
caddy_site_domains:
  - justingarter.com
  - www.justingarter.com
caddy_web_root: /var/www/portfolio
caddy_web_root_owner: justin
caddy_web_root_group: justin
caddy_log_path: /var/log/caddy/access.log
caddy_gomemlimit: 256MiB
caddy_memory_max: 384M
caddy_protocols: h1 h2

# Cloudflare origin-facing ranges. Static snapshot — see roles/caddy/README.
# Refresh from https://www.cloudflare.com/ips-v4
# IPv6 ranges are deliberately omitted: the origin publishes no AAAA record,
# so Cloudflare connects over IPv4. Add them before ever publishing one.
caddy_trusted_proxies:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22

caddy_security_headers:
  Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
  X-Content-Type-Options: "nosniff"
  X-Frame-Options: "DENY"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "geolocation=(), microphone=(), camera=()"

# ── fail2ban ─────────────────────────────────────────────────────────────────
# nftables, not iptables: this host has no iptables binary. A jail configured
# with iptables-multiport looks healthy and bans nothing.
f2b_banaction: "nftables[type=multiport]"
f2b_banaction_allports: "nftables[type=allports]"
f2b_ignoreip: "127.0.0.1/8 ::1 {{ ssh_admin_sources | join(' ') }}"
f2b_caddy404_maxretry: 10
f2b_caddy404_findtime: 120
f2b_caddy404_bantime: 3600

# ── DDNS ─────────────────────────────────────────────────────────────────────
ddns_zone_id: 63de65311b9a3ed27665b03d0dd88ed8
# origin is DNS-only (unproxied) so Minecraft can CNAME to it; the apex is
# proxied. Both must already exist in Cloudflare: the updater edits records,
# it never creates them.
ddns_records:
  - justingarter.com
  - origin.justingarter.com
ddns_interval: 5min
# ddns_api_token lives in vault.yml

# ── Swap ─────────────────────────────────────────────────────────────────────
# zram (priority 100) fills first; this file on the microSD is a small
# backstop only. Kept small because every swap write is card wear (DR-003 7).
# Do NOT touch /var/swap — that is zram's writeback store, managed by
# rpi-setup-loop@var-swap.service, not a stale swapfile.
swapfile_path: /swapfile
swapfile_size_mb: 512
swapfile_priority: -10

# ── microSD wear (DR-003 7) ──────────────────────────────────────────────────
# noatime drops a write per read; commit=600 batches ext4 journal flushes to
# every 10 minutes, so Caddy's access log and fail2ban coalesce into few large
# writes. A hard power loss drops up to 10 minutes of data (R14 accepts an
# hour). journald keeps everything in RAM.
root_mount_opts: defaults,noatime,commit=600
journald_runtime_max: 32M

# ── Packages ─────────────────────────────────────────────────────────────────
base_packages: [curl, jq, rsync, ethtool, nftables, gnupg, ca-certificates]
base_packages_absent: [avahi-daemon]

# Tooling this host needs to verify its own claims. wrk produces the load-test
# figures published on the portfolio, and it has to run here rather than on a
# workstation because the published methodology has the generator sharing the
# same four cores as Caddy. nmap and dnsutils are deliberately excluded: both
# are workstation tools, and scanning from inside the DMZ tests the wrong
# direction anyway.
verification_packages: [wrk]

# ── Thermal monitoring ───────────────────────────────────────────────────────
thermal_log: /var/log/pi-thermal.log
thermal_interval: 1h
